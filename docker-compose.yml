services:
  app:
    build: .
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      PORT: 8787
      OLLAMA_URL: http://ollama:11434/api/chat
      OLLAMA_MODEL: llama3.2:3b
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
